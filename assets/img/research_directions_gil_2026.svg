    <rect x="70" y="182" width="430" height="230" rx="18" fill="#ffffff" stroke="#06204a" stroke-width="3"/>
    <path d="M70 200a18 18 0 0 1 18-18h394a18 18 0 0 1 18 18v52H70z" fill="#06204a"/>
