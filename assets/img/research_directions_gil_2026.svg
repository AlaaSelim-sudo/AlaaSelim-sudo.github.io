    <rect x="565" y="595" width="470" height="205" rx="18" fill="#ffffff" stroke="#06204a" stroke-width="3"/>
    <path d="M565 613a18 18 0 0 1 18-18h434a18 18 0 0 1 18 18v52H565z" fill="#06204a"/>
    <text class="hdr" x="800" y="640" text-anchor="middle">Grid-Aware Infrastructure</text>
    <g transform="translate(610 690)" class="teal">
      <path d="M0 85H105V22H72V0H34v22H0Z"/><path d="M43 12h20M53 3v20"/><path d="M20 45h13M48 45h13M77 45h13M20 68h13M48 68h13M77 68h13"/>
    </g>
    <line x1="735" y1="685" x2="735" y2="765" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="765" cy="702" r="6" fill="#0f766e"/><text class="small" x="785" y="710">critical facilities</text>
    <circle cx="765" cy="735" r="6" fill="#0f766e"/><text class="small" x="785" y="743">hospital energy resilience</text>
    <circle cx="765" cy="768" r="6" fill="#0f766e"/><text class="small" x="785" y="776">decision support under outages</text>

    <!-- bottom right -->
    <rect x="1100" y="570" width="430" height="230" rx="18" fill="#ffffff" stroke="#06204a" stroke-width="3"/>
    <path d="M1100 588a18 18 0 0 1 18-18h394a18 18 0 0 1 18 18v52h-430z" fill="#06204a"/>
    <text class="hdr" x="1315" y="615" text-anchor="middle">Data Centers and Flexible Loads</text>
    <g transform="translate(1135 666)" class="teal">
      <rect x="0" y="0" width="48" height="104"/><rect x="62" y="25" width="45" height="79"/>
      <path d="M12 22h24M12 52h24M12 82h24M74 46h20M74 74h20"/>
      <path d="M140 8c-28 17-42 42-31 70 26-7 44-31 31-70Z"/><path d="M121 71c10 13 24 22 43 28"/>
      <path d="M155 48c20 30 30 47 30 62 0 16-13 29-30 29s-30-13-30-29c0-15 10-32 30-62Z"/>
    </g>
    <line x1="1245" y1="666" x2="1245" y2="760" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="1276" cy="680" r="6" fill="#0f766e"/><text class="small" x="1296" y="688">grid integration and restoration</text>
    <circle cx="1276" cy="718" r="6" fill="#0f766e"/><text class="small" x="1296" y="726">hosting capacity and GFM support</text>
    <circle cx="1276" cy="756" r="6" fill="#0f766e"/><text class="small" x="1296" y="764">energy-water-climate impacts</text>
  </g>

  <!-- footer -->
  <rect x="120" y="820" width="1360" height="56" rx="18" fill="#ecfeff" stroke="#0f766e" stroke-width="2.5"/>
  <g transform="translate(170 838)" class="teal">
    <circle cx="16" cy="16" r="11"/><circle cx="47" cy="16" r="13"/><path d="M16 1v-8M16 31v8M1 16h-8M31 16h8M47 1v-8M47 31v8M32 16h-8M62 16h8"/>
  </g>
  <text class="methodb" x="275" y="857">Core methods:</text>
  <text class="method" x="510" y="857">optimization  •  simulation  •  machine learning  •  hardware-in-the-loop validation</text>
