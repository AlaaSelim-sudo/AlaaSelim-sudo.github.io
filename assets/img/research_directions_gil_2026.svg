    <circle cx="220" cy="330" r="6" fill="#0f766e"/><text class="small" x="240" y="338">microgrids and DER coordination</text>
    <circle cx="220" cy="368" r="6" fill="#0f766e"/><text class="small" x="240" y="376">extreme-event resilience</text>

