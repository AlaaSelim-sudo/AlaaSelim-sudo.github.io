    <rect x="1100" y="182" width="430" height="230" rx="18" fill="#ffffff" stroke="#06204a" stroke-width="3"/>
    <path d="M1100 200a18 18 0 0 1 18-18h394a18 18 0 0 1 18 18v52h-430z" fill="#06204a"/>
    <text class="hdr" x="1315" y="227" text-anchor="middle">AI for Power Systems</text>
    <g transform="translate(1135 283)" class="teal">
      <path d="M70 90c-18-10-28-27-27-49 1-31 28-49 55-41 24 7 36 30 30 53"/>
      <path d="M69 29c18-6 34 7 34 24 0 15-11 27-26 27H58"/>
      <circle cx="70" cy="26" r="5" fill="#0f766e"/><circle cx="104" cy="53" r="5" fill="#0f766e"/><circle cx="77" cy="80" r="5" fill="#0f766e"/>
      <path d="M70 26 L104 53 L77 80 L70 26"/>
    </g>
    <line x1="1245" y1="278" x2="1245" y2="372" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="1276" cy="292" r="6" fill="#0f766e"/><text class="small" x="1296" y="300">safe reinforcement learning</text>
    <circle cx="1276" cy="330" r="6" fill="#0f766e"/><text class="small" x="1296" y="338">physics-informed optimization</text>
    <circle cx="1276" cy="368" r="6" fill="#0f766e"/><text class="small" x="1296" y="376">LLM-based operator support</text>

    <!-- bottom left -->
    <rect x="70" y="570" width="430" height="230" rx="18" fill="#ffffff" stroke="#06204a" stroke-width="3"/>
    <path d="M70 588a18 18 0 0 1 18-18h394a18 18 0 0 1 18 18v52H70z" fill="#06204a"/>
