<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:64px;font-weight:800;fill:#06204a;letter-spacing:.2px}
      .subtitle{font-family:Inter,Arial,sans-serif;font-size:32px;font-style:italic;fill:#233b63}
      .hdr{font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:800;fill:#ffffff}
      .ctitle{font-family:Inter,Arial,sans-serif;font-size:34px;font-weight:800;fill:#06204a}
      .body{font-family:Inter,Arial,sans-serif;font-size:25px;fill:#111827}
      .small{font-family:Inter,Arial,sans-serif;font-size:20px;fill:#334155}
      .method{font-family:Inter,Arial,sans-serif;font-size:28px;fill:#0f4f5b}
      .methodb{font-family:Inter,Arial,sans-serif;font-size:32px;font-weight:800;fill:#0f4f5b}
      .navy{stroke:#06204a;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .teal{stroke:#0f766e;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .tealfill{fill:#0f766e}
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#06204a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="20" y="20" width="1560" height="860" rx="34" fill="#f8fafc" stroke="#e2e8f0"/>

  <text class="title" x="800" y="78" text-anchor="middle">Research Directions</text>
  <text class="subtitle" x="800" y="124" text-anchor="middle">Grid Intelligence Lab (GIL)</text>

  <!-- center box -->
  <rect x="565" y="190" width="470" height="320" rx="24" fill="#ffffff" stroke="#06204a" stroke-width="4" filter="url(#shadow)"/>
  <g transform="translate(760 218)">
    <path class="navy" d="M20 22c-19 0-32 15-32 34 0 7 2 13 6 19-10 6-16 17-16 30 0 18 14 33 32 34 5 16 19 27 36 27 16 0 29-9 36-22"/>
    <path class="navy" d="M62 22c19 0 32 15 32 34 0 7-2 13-6 19 10 6 16 17 16 30 0 18-14 33-32 34-5 16-19 27-36 27"/>
    <path class="teal" d="M47 26v134M47 54h34M81 54v-20M47 88h55M102 88v-22M47 122h44M91 122v25"/>
    <circle cx="81" cy="34" r="7" fill="#0f766e"/><circle cx="102" cy="66" r="7" fill="#0f766e"/><circle cx="91" cy="147" r="7" fill="#0f766e"/>
  </g>
  <text class="ctitle" x="800" y="348" text-anchor="middle">Grid Intelligence Lab (GIL)</text>
  <line x1="650" y1="380" x2="950" y2="380" stroke="#06204a" stroke-width="3"/>
  <circle cx="800" cy="380" r="7" fill="#06204a"/>
  <text class="body" x="800" y="424" text-anchor="middle">AI-assisted, physics-informed,</text>
  <text class="body" x="800" y="460" text-anchor="middle">and optimization-based methods</text>
  <text class="body" x="800" y="496" text-anchor="middle">for resilient power and energy systems</text>

  <!-- connector lines -->
  <path d="M565 300 L505 300" class="navy" marker-end="url(#arrow)"/>
  <path d="M1035 300 L1095 300" class="navy" marker-end="url(#arrow)"/>
  <path d="M565 412 H505 V586" class="navy" marker-end="url(#arrow)"/>
  <path d="M1035 412 H1110 V586" class="navy" marker-end="url(#arrow)"/>
  <path d="M800 510 V568" class="navy" marker-end="url(#arrow)"/>

