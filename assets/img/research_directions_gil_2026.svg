    <g transform="translate(108 665)" class="teal">
      <path d="M45 0 L88 18 V58c0 31-22 52-43 64C24 110 2 89 2 58V18Z"/>
      <rect x="31" y="50" width="28" height="32" rx="5"/><path d="M36 50V39c0-7 5-12 12-12s12 5 12 12v11"/>
      <path d="M0 44h-28M90 44h28M0 76h-28M90 76h28"/><circle cx="-32" cy="44" r="5" fill="#0f766e"/><circle cx="122" cy="44" r="5" fill="#0f766e"/><circle cx="-32" cy="76" r="5" fill="#0f766e"/><circle cx="122" cy="76" r="5" fill="#0f766e"/>
    </g>
    <line x1="190" y1="666" x2="190" y2="760" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="220" cy="680" r="6" fill="#0f766e"/><text class="small" x="240" y="688">attack detection and mitigation</text>
    <circle cx="220" cy="718" r="6" fill="#0f766e"/><text class="small" x="240" y="726">communication-aware validation</text>
    <circle cx="220" cy="756" r="6" fill="#0f766e"/><text class="small" x="240" y="764">topology and control defense</text>

