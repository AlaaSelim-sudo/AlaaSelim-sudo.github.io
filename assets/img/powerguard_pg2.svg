<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" rx="26" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-size="32" font-weight="700" style="font-family: Arial, Helvetica, sans-serif;" fill="#102033">PowerGuard PG2: Multi-Evidence Cyber-Physical Defense</text>
  <g style="font-family: Arial, Helvetica, sans-serif;" font-size="18" fill="#102033">
    <rect x="70" y="170" width="220" height="120" rx="18" fill="#fff" stroke="#c8d2e1" stroke-width="2"/>
    <text x="180" y="215" text-anchor="middle" font-weight="700">Incoming Command</text>
    <text x="180" y="248" text-anchor="middle">control / switching / setpoint</text>
    <path d="M300 230 L380 230" stroke="#6b7c93" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="395" y="115" width="410" height="230" rx="22" fill="#fff" stroke="#c8d2e1" stroke-width="2"/>
    <text x="600" y="155" text-anchor="middle" font-weight="700">Evidence Fusion</text>
    <rect x="430" y="185" width="100" height="55" rx="12" fill="#eaf0f8"/><text x="480" y="220" text-anchor="middle">Protocol</text>
    <rect x="550" y="185" width="100" height="55" rx="12" fill="#eaf0f8"/><text x="600" y="220" text-anchor="middle">Topology</text>
