<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:44px;font-weight:800;fill:#0f172a}
      .subtitle{font-family:Inter,Arial,sans-serif;font-size:22px;fill:#475569}
      .label{font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:800;fill:#0f172a}
      .small{font-family:Inter,Arial,sans-serif;font-size:18px;fill:#475569}
      .tiny{font-family:Inter,Arial,sans-serif;font-size:15px;fill:#64748b}
      .panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:2.2;filter:url(#shadow)}
      .evidence{fill:#f8fafc;stroke:#dbe3ef;stroke-width:1.8}
      .tag{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:700;fill:#991b1b}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto"><path d="M1,1 L13,7.5 L1,14 Z" fill="#dc2626"/></marker>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  </defs>

  <rect width="1600" height="900" rx="34" fill="#ffffff"/>
  <rect x="40" y="35" width="1520" height="830" rx="34" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="80" y="70" width="1440" height="118" rx="26" fill="url(#top)" stroke="#cbd5e1"/>
  <text x="120" y="123" class="title">PowerGuard PG2</text>
  <text x="120" y="158" class="subtitle">Multi-evidence cyber-physical defense for grid communication and control actions</text>

  <g transform="translate(95,315)">
    <rect class="panel" x="0" y="0" width="285" height="190" rx="26"/>
    <text x="142" y="58" class="label" text-anchor="middle">Incoming action</text>
    <text x="142" y="100" class="small" text-anchor="middle">setpoint command</text>
    <text x="142" y="130" class="small" text-anchor="middle">switching request</text>
    <text x="142" y="160" class="small" text-anchor="middle">communication event</text>
  </g>

  <path d="M400 410 C450 410 480 410 535 410" stroke="#dc2626" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(535,225)">
    <rect class="panel" x="0" y="0" width="530" height="370" rx="32"/>
    <text x="265" y="55" class="label" text-anchor="middle">Evidence fusion gate</text>
    <g transform="translate(60,95)">
      <rect class="evidence" x="0" y="0" width="410" height="68" rx="18"/>
      <circle cx="38" cy="34" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
      <text x="215" y="31" class="small" text-anchor="middle">Protocol evidence</text>
      <text x="215" y="54" class="tiny" text-anchor="middle">message validity, timing, and command semantics</text>
    </g>
    <g transform="translate(60,180)">
      <rect class="evidence" x="0" y="0" width="410" height="68" rx="18"/>
      <circle cx="38" cy="34" r="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
      <text x="215" y="31" class="small" text-anchor="middle">Topology evidence</text>
      <text x="215" y="54" class="tiny" text-anchor="middle">reachable devices, path consistency, and network state</text>
    </g>
    <g transform="translate(60,265)">
      <rect class="evidence" x="0" y="0" width="410" height="68" rx="18"/>
      <circle cx="38" cy="34" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <text x="215" y="31" class="small" text-anchor="middle">Physics evidence</text>
      <text x="215" y="54" class="tiny" text-anchor="middle">voltage, flow, and equipment feasibility</text>
    </g>
  </g>

  <path d="M1085 410 C1135 410 1160 410 1215 410" stroke="#dc2626" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(1215,275)">
    <rect class="panel" x="0" y="0" width="290" height="270" rx="28"/>
    <text x="145" y="56" class="label" text-anchor="middle">Decision</text>
    <rect x="52" y="88" width="185" height="44" rx="16" fill="#dcfce7" stroke="#16a34a"/>
    <text x="145" y="117" class="tag" text-anchor="middle" fill="#166534">accept</text>
    <rect x="52" y="146" width="185" height="44" rx="16" fill="#fee2e2" stroke="#dc2626"/>
    <text x="145" y="175" class="tag" text-anchor="middle">block</text>
    <rect x="52" y="204" width="185" height="44" rx="16" fill="#fef3c7" stroke="#d97706"/>
    <text x="145" y="233" class="tag" text-anchor="middle" fill="#92400e">recover</text>
  </g>

  <g transform="translate(215,665)">
    <rect class="panel" x="0" y="0" width="1170" height="120" rx="28"/>
    <text x="585" y="45" class="label" text-anchor="middle">Core principle</text>
    <text x="585" y="82" class="small" text-anchor="middle">A grid control action is trusted only when protocol behavior, network topology, and power-system physics agree.</text>
  </g>
</svg>
