<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:44px;font-weight:800;fill:#0f172a}
      .subtitle{font-family:Inter,Arial,sans-serif;font-size:22px;fill:#475569}
      .label{font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:800;fill:#0f172a}
      .small{font-family:Inter,Arial,sans-serif;font-size:18px;fill:#475569}
      .tiny{font-family:Inter,Arial,sans-serif;font-size:15px;fill:#64748b}
      .metric{font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;fill:#065f46}
      .panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:2.2;filter:url(#shadow)}
      .soft{fill:#f8fafc;stroke:#dbe3ef;stroke-width:1.6}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto"><path d="M1,1 L13,7.5 L1,14 Z" fill="#2563eb"/></marker>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
  </defs>

  <rect width="1600" height="900" rx="34" fill="#ffffff"/>
  <rect x="40" y="35" width="1520" height="830" rx="34" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="80" y="70" width="1440" height="118" rx="26" fill="url(#top)" stroke="#cbd5e1"/>
  <text x="120" y="123" class="title">Data Centers as Restoration-Compatible Grid Assets</text>
  <text x="120" y="158" class="subtitle">A grid-facing coordination layer that balances restoration support with critical IT-service continuity</text>

  <g transform="translate(90,235)">
    <rect class="panel" x="0" y="0" width="300" height="230" rx="26"/>
    <circle cx="70" cy="72" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <path d="M58 75 L70 50 L83 75 L72 75 L82 100 L57 68 L68 68 Z" fill="#2563eb"/>
    <text x="150" y="72" class="label" text-anchor="middle">Restoration state</text>
    <text x="150" y="120" class="small" text-anchor="middle">blackstart stage</text>
    <text x="150" y="150" class="small" text-anchor="middle">load pickup sequence</text>
    <text x="150" y="180" class="small" text-anchor="middle">limited energization path</text>
  </g>

  <path d="M410 350 C470 350 500 350 555 350" stroke="#2563eb" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(555,215)">
    <rect class="panel" x="0" y="0" width="490" height="300" rx="30"/>
    <text x="245" y="56" class="label" text-anchor="middle">Data-center energy model</text>
    <rect class="soft" x="45" y="88" width="180" height="78" rx="18"/>
    <text x="135" y="122" class="small" text-anchor="middle">grid import</text>
    <text x="135" y="148" class="tiny" text-anchor="middle">controllable envelope</text>
    <rect class="soft" x="265" y="88" width="180" height="78" rx="18"/>
    <text x="355" y="122" class="small" text-anchor="middle">export support</text>
    <text x="355" y="148" class="tiny" text-anchor="middle">backup and battery</text>
    <rect class="soft" x="45" y="188" width="180" height="70" rx="18"/>
    <text x="135" y="220" class="small" text-anchor="middle">IT deferral</text>
    <text x="135" y="245" class="tiny" text-anchor="middle">service-aware</text>
    <rect class="soft" x="265" y="188" width="180" height="70" rx="18"/>
    <text x="355" y="220" class="small" text-anchor="middle">thermal limits</text>
    <text x="355" y="245" class="tiny" text-anchor="middle">risk constraints</text>
  </g>

  <path d="M1065 350 C1120 350 1150 350 1210 350" stroke="#2563eb" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(1210,235)">
    <rect class="panel" x="0" y="0" width="300" height="230" rx="26"/>
    <circle cx="70" cy="72" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <path d="M50 73 L64 87 L92 55" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="72" class="label" text-anchor="middle">Restoration value</text>
    <text x="150" y="120" class="small" text-anchor="middle">higher restored load</text>
    <text x="150" y="150" class="small" text-anchor="middle">lower unserved energy</text>
    <text x="150" y="180" class="small" text-anchor="middle">critical IT preserved</text>
  </g>

  <g transform="translate(190,620)">
    <rect class="panel" x="0" y="0" width="1220" height="150" rx="28"/>
    <text x="610" y="43" class="label" text-anchor="middle">Validation loop</text>
    <g transform="translate(90,75)">
      <circle cx="0" cy="0" r="10" fill="#2563eb"/><text x="25" y="7" class="metric">policy ablation</text>
      <circle cx="250" cy="0" r="10" fill="#2563eb"/><text x="275" y="7" class="metric">stress robustness</text>
      <circle cx="560" cy="0" r="10" fill="#2563eb"/><text x="585" y="7" class="metric">IEEE 39 and 300-bus cases</text>
      <circle cx="930" cy="0" r="10" fill="#2563eb"/><text x="955" y="7" class="metric">service continuity metrics</text>
    </g>
  </g>
</svg>
