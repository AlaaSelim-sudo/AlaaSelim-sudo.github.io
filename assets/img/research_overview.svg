<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" rx="28" fill="#f7f9fc"/>
  <text x="600" y="58" text-anchor="middle" font-size="34" font-weight="700" style="font-family: Arial, Helvetica, sans-serif;" fill="#102033">Selim Research Group: Resilient Energy Intelligence</text>
  <text x="600" y="95" text-anchor="middle" font-size="18" style="font-family: Arial, Helvetica, sans-serif;" fill="#4d5b6a">AI, optimization, cyber-physical security, and grid-aware infrastructure for reliable energy systems</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#102033">
    <rect x="70" y="165" width="220" height="130" rx="20" fill="#ffffff" stroke="#c8d2e1" stroke-width="2"/>
    <text x="180" y="207" text-anchor="middle" font-weight="700">Power Systems</text>
    <text x="180" y="238" text-anchor="middle">restoration</text>
    <text x="180" y="263" text-anchor="middle">microgrids</text>
    <text x="180" y="288" text-anchor="middle">grid-forming resources</text>

    <rect x="350" y="165" width="220" height="130" rx="20" fill="#ffffff" stroke="#c8d2e1" stroke-width="2"/>
    <text x="460" y="207" text-anchor="middle" font-weight="700">AI + Optimization</text>
    <text x="460" y="238" text-anchor="middle">safe RL</text>
    <text x="460" y="263" text-anchor="middle">MPC</text>
    <text x="460" y="288" text-anchor="middle">physics-informed LLMs</text>

    <rect x="630" y="165" width="220" height="130" rx="20" fill="#ffffff" stroke="#c8d2e1" stroke-width="2"/>
    <text x="740" y="207" text-anchor="middle" font-weight="700">Cyber-Physical Security</text>
    <text x="740" y="238" text-anchor="middle">attack detection</text>
    <text x="740" y="263" text-anchor="middle">defense</text>
    <text x="740" y="288" text-anchor="middle">testbeds</text>

    <rect x="910" y="165" width="220" height="130" rx="20" fill="#ffffff" stroke="#c8d2e1" stroke-width="2"/>
    <text x="1020" y="207" text-anchor="middle" font-weight="700">Critical Infrastructure</text>
    <text x="1020" y="238" text-anchor="middle">data centers</text>
    <text x="1020" y="263" text-anchor="middle">hospitals</text>
    <text x="1020" y="288" text-anchor="middle">large flexible loads</text>
  </g>
  <line x1="180" y1="300" x2="420" y2="420" stroke="#7d8fa8" stroke-width="3"/>
  <line x1="460" y1="300" x2="500" y2="420" stroke="#7d8fa8" stroke-width="3"/>
  <line x1="740" y1="300" x2="700" y2="420" stroke="#7d8fa8" stroke-width="3"/>
  <line x1="1020" y1="300" x2="780" y2="420" stroke="#7d8fa8" stroke-width="3"/>
  <rect x="390" y="410" width="420" height="115" rx="28" fill="#102033"/>
  <text x="600" y="455" text-anchor="middle" font-size="24" font-weight="700" style="font-family: Arial, Helvetica, sans-serif;" fill="#ffffff">Research Goal</text>
  <text x="600" y="488" text-anchor="middle" font-size="18" style="font-family: Arial, Helvetica, sans-serif;" fill="#ffffff">safer decisions for power and energy systems</text>
  <text x="600" y="514" text-anchor="middle" font-size="18" style="font-family: Arial, Helvetica, sans-serif;" fill="#ffffff">under outages, uncertainty, and cyber-physical disturbances</text>
</svg>