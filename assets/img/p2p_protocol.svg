<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:44px;font-weight:800;fill:#0f172a}
      .subtitle{font-family:Inter,Arial,sans-serif;font-size:22px;fill:#475569}
      .label{font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:800;fill:#0f172a}
      .small{font-family:Inter,Arial,sans-serif;font-size:18px;fill:#475569}
      .tiny{font-family:Inter,Arial,sans-serif;font-size:15px;fill:#64748b}
      .panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:2.2;filter:url(#shadow)}
      .soft{fill:#f8fafc;stroke:#dbe3ef;stroke-width:1.6}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto"><path d="M1,1 L13,7.5 L1,14 Z" fill="#7c3aed"/></marker>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ccfbf1"/></linearGradient>
  </defs>

  <rect width="1600" height="900" rx="34" fill="#ffffff"/>
  <rect x="40" y="35" width="1520" height="830" rx="34" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="80" y="70" width="1440" height="118" rx="26" fill="url(#top)" stroke="#cbd5e1"/>
  <text x="120" y="123" class="title">Patient-to-Power Protocol</text>
  <text x="120" y="158" class="subtitle">A transferable hospital energy-resilience workflow linking clinical surge to facility energy decisions</text>

  <g transform="translate(105,250)">
    <rect class="panel" x="0" y="0" width="300" height="235" rx="28"/>
    <text x="150" y="55" class="label" text-anchor="middle">Clinical demand</text>
    <rect class="soft" x="45" y="82" width="210" height="42" rx="14"/><text x="150" y="110" class="small" text-anchor="middle">ED and ICU surge</text>
    <rect class="soft" x="45" y="138" width="210" height="42" rx="14"/><text x="150" y="166" class="small" text-anchor="middle">occupancy pressure</text>
    <rect class="soft" x="45" y="194" width="210" height="42" rx="14"/><text x="150" y="222" class="small" text-anchor="middle">clinical priority</text>
  </g>

  <path d="M425 370 C475 370 505 370 555 370" stroke="#7c3aed" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(555,220)">
    <rect class="panel" x="0" y="0" width="490" height="300" rx="30"/>
    <text x="245" y="56" class="label" text-anchor="middle">Facility and energy state</text>
    <g transform="translate(46,90)">
      <rect class="soft" x="0" y="0" width="180" height="74" rx="18"/><text x="90" y="32" class="small" text-anchor="middle">backup power</text><text x="90" y="56" class="tiny" text-anchor="middle">generators and fuel</text>
      <rect class="soft" x="220" y="0" width="180" height="74" rx="18"/><text x="310" y="32" class="small" text-anchor="middle">HVAC state</text><text x="310" y="56" class="tiny" text-anchor="middle">thermal safety</text>
      <rect class="soft" x="0" y="100" width="180" height="74" rx="18"/><text x="90" y="132" class="small" text-anchor="middle">essential loads</text><text x="90" y="156" class="tiny" text-anchor="middle">care continuity</text>
      <rect class="soft" x="220" y="100" width="180" height="74" rx="18"/><text x="310" y="132" class="small" text-anchor="middle">outage context</text><text x="310" y="156" class="tiny" text-anchor="middle">storm and grid status</text>
    </g>
  </g>

  <path d="M1065 370 C1115 370 1145 370 1195 370" stroke="#7c3aed" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(1195,250)">
    <rect class="panel" x="0" y="0" width="300" height="235" rx="28"/>
    <text x="150" y="55" class="label" text-anchor="middle">Operator output</text>
    <rect x="45" y="86" width="210" height="44" rx="15" fill="#dcfce7" stroke="#16a34a"/><text x="150" y="115" class="small" text-anchor="middle">safe priorities</text>
    <rect x="45" y="146" width="210" height="44" rx="15" fill="#e0f2fe" stroke="#0284c7"/><text x="150" y="175" class="small" text-anchor="middle">risk summary</text>
    <rect x="45" y="206" width="210" height="44" rx="15" fill="#fef3c7" stroke="#d97706"/><text x="150" y="235" class="small" text-anchor="middle">action guidance</text>
  </g>

  <g transform="translate(250,625)">
    <rect class="panel" x="0" y="0" width="1100" height="135" rx="28"/>
    <text x="550" y="45" class="label" text-anchor="middle">Decision logic</text>
    <text x="550" y="82" class="small" text-anchor="middle">Patient surge + hospital workflows + energy constraints are converted into operator-facing, safety-aware decisions.</text>
    <text x="550" y="112" class="tiny" text-anchor="middle">Designed for urban and rural facilities under winter storms, outages, and compound stress events.</text>
  </g>
</svg>
