<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" rx="26" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-size="32" font-weight="700" style="font-family: Arial, Helvetica, sans-serif;" fill="#102033">Patient-to-Power Protocol</text>
  <text x="600" y="88" text-anchor="middle" font-size="18" style="font-family: Arial, Helvetica, sans-serif;" fill="#4d5b6a">Connecting clinical surge, facility workflows, and energy decisions during compound outages</text>
  <g style="font-family: Arial, Helvetica, sans-serif;" font-size="18" fill="#102033">
    <rect x="70" y="160" width="230" height="130" rx="18" fill="#fff" stroke="#c8d2e1" stroke-width="2"/>
    <text x="185" y="202" text-anchor="middle" font-weight="700">Patient Surge</text>
    <text x="185" y="235" text-anchor="middle">ED / ICU demand</text><text x="185" y="260" text-anchor="middle">clinical priorities</text>
    <path d="M310 225 L395 225" stroke="#6b7c93" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="410" y="130" width="380" height="190" rx="22" fill="#fff" stroke="#c8d2e1" stroke-width="2"/>
    <text x="600" y="175" text-anchor="middle" font-weight="700">Energy Decision Layer</text>
    <text x="600" y="213" text-anchor="middle">backup generation • fuel • HVAC • essential loads</text>
    <text x="600" y="243" text-anchor="middle">operator summary • risk index • safety constraints</text>
    <text x="600" y="273" text-anchor="middle">AI reasoning grounded by measured facility data</text>
    <path d="M800 225 L890 225" stroke="#6b7c93" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="905" y="160" width="230" height="130" rx="18" fill="#102033"/>
    <text x="1020" y="205" text-anchor="middle" font-weight="700" fill="#fff">Continuity</text>
    <text x="1020" y="238" text-anchor="middle" fill="#fff">safer hospital operation</text><text x="1020" y="263" text-anchor="middle" fill="#fff">during outages</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6b7c93"/></marker></defs>
</svg>