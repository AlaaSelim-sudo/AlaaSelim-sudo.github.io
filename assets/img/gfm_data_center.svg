<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:44px;font-weight:800;fill:#0f172a}
      .subtitle{font-family:Inter,Arial,sans-serif;font-size:22px;fill:#475569}
      .label{font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:800;fill:#0f172a}
      .small{font-family:Inter,Arial,sans-serif;font-size:18px;fill:#475569}
      .tiny{font-family:Inter,Arial,sans-serif;font-size:15px;fill:#64748b}
      .panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:2.2;filter:url(#shadow)}
      .soft{fill:#f8fafc;stroke:#dbe3ef;stroke-width:1.6}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto"><path d="M1,1 L13,7.5 L1,14 Z" fill="#0f766e"/></marker>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#ccfbf1"/></linearGradient>
  </defs>

  <rect width="1600" height="900" rx="34" fill="#ffffff"/>
  <rect x="40" y="35" width="1520" height="830" rx="34" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="80" y="70" width="1440" height="118" rx="26" fill="url(#top)" stroke="#cbd5e1"/>
  <text x="120" y="123" class="title">Grid-Forming Data Center Flexibility</text>
  <text x="120" y="158" class="subtitle">Dynamic hosting-capacity analysis for large flexible loads with grid-forming support</text>

  <g transform="translate(95,250)">
    <rect class="panel" x="0" y="0" width="335" height="260" rx="30"/>
    <text x="168" y="55" class="label" text-anchor="middle">Flexible data center</text>
    <rect class="soft" x="55" y="92" width="225" height="50" rx="16"/><text x="168" y="124" class="small" text-anchor="middle">load modulation</text>
    <rect class="soft" x="55" y="158" width="225" height="50" rx="16"/><text x="168" y="190" class="small" text-anchor="middle">IT service limits</text>
    <rect class="soft" x="55" y="224" width="225" height="50" rx="16"/><text x="168" y="256" class="small" text-anchor="middle">thermal envelope</text>
  </g>

  <path d="M450 380 C500 380 530 380 580 380" stroke="#0f766e" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(580,215)">
    <rect class="panel" x="0" y="0" width="440" height="330" rx="34"/>
    <text x="220" y="58" class="label" text-anchor="middle">Grid-forming resource</text>
    <circle cx="220" cy="150" r="70" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
    <path d="M168 150 C188 105 252 105 272 150 C252 195 188 195 168 150 Z" fill="none" stroke="#0f766e" stroke-width="6"/>
    <path d="M168 150 C188 195 252 195 272 150" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <text x="220" y="260" class="small" text-anchor="middle">frequency and voltage forming response</text>
    <text x="220" y="290" class="tiny" text-anchor="middle">controls are screened against dynamic-security limits</text>
  </g>

  <path d="M1040 380 C1090 380 1120 380 1170 380" stroke="#0f766e" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(1170,250)">
    <rect class="panel" x="0" y="0" width="335" height="260" rx="30"/>
    <text x="168" y="55" class="label" text-anchor="middle">Hosting capacity</text>
    <g transform="translate(55,92)">
      <line x1="0" y1="120" x2="225" y2="120" stroke="#94a3b8" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="120" stroke="#94a3b8" stroke-width="2"/>
      <path d="M0 105 C45 102 70 92 100 72 C135 48 165 40 225 35" fill="none" stroke="#0f766e" stroke-width="6"/>
      <path d="M0 105 C45 112 90 112 130 92 C165 72 190 62 225 60" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 8"/>
      <text x="112" y="152" class="tiny" text-anchor="middle">secure MW envelope</text>
    </g>
  </g>

  <g transform="translate(245,630)">
    <rect class="panel" x="0" y="0" width="1110" height="145" rx="28"/>
    <text x="555" y="45" class="label" text-anchor="middle">Security criteria</text>
    <text x="555" y="82" class="small" text-anchor="middle">The capacity limit is set by frequency nadir, RoCoF, voltage recovery, and transient response under contingencies.</text>
    <text x="555" y="112" class="tiny" text-anchor="middle">The output is a dynamic, scenario-dependent hosting margin rather than a static load limit.</text>
  </g>
</svg>
