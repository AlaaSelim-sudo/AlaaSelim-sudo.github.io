<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061826"/>
      <stop offset="0.55" stop-color="#0d3354"/>
      <stop offset="1" stop-color="#0a5d6c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#eaf6f8" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00111f" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:44px;font-weight:800;fill:white;letter-spacing:.2px}
      .sub{font-family:Inter,Arial,sans-serif;font-size:20px;fill:#cbe7ef}
      .h{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:800;fill:#09243a}
      .t{font-family:Inter,Arial,sans-serif;font-size:17px;fill:#26465d}
      .small{font-family:Inter,Arial,sans-serif;font-size:15px;fill:#557086}
      .node{fill:url(#card);stroke:#bde3ec;stroke-width:1.5;filter:url(#shadow)}
      .chip{fill:#0d5b7a;stroke:#68d0e0;stroke-width:1.2}
      .line{stroke:#89d9e8;stroke-width:3;stroke-opacity:.75;fill:none}
    </style>
  </defs>
  <rect width="1400" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="1180" cy="110" r="210" fill="#38c5d9" opacity="0.12"/>
  <circle cx="170" cy="640" r="230" fill="#4aa3ff" opacity="0.10"/>
  <text x="700" y="70" text-anchor="middle" class="title">Grid Intelligence Lab (GIL)</text>
  <text x="700" y="105" text-anchor="middle" class="sub">Students and mentees organized around AI, resilience, cybersecurity, and grid-aware infrastructure</text>

  <rect x="550" y="285" width="300" height="150" rx="28" fill="#071827" stroke="#72dbe8" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="700" y="335" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:28px;font-weight:800;fill:#fff">GIL Research Core</text>
  <text x="700" y="372" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:17px;fill:#cbe7ef">AI + optimization + power-system physics</text>
  <text x="700" y="402" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:17px;fill:#cbe7ef">for safer energy decisions</text>

  <path d="M560 355 C440 305 365 265 280 230" class="line"/>
  <path d="M570 405 C440 470 365 515 270 570" class="line"/>
  <path d="M840 355 C965 305 1040 260 1140 225" class="line"/>
  <path d="M835 410 C960 475 1035 515 1150 570" class="line"/>

  <rect x="80" y="150" width="390" height="170" rx="26" class="node"/>
  <text x="275" y="195" text-anchor="middle" class="h">Dartmouth College</text>
  <text x="275" y="230" text-anchor="middle" class="t">Run Yang · Maanat H. Bhadani</text>
  <text x="275" y="258" text-anchor="middle" class="t">Wai Yan Win Aung · Seth Han · Adhiraj Sud</text>
  <text x="275" y="288" text-anchor="middle" class="small">LLMs, agentic AI, healthcare cybersecurity, VPP security</text>

  <rect x="80" y="500" width="390" height="150" rx="26" class="node"/>
  <text x="275" y="545" text-anchor="middle" class="h">Ain Shams University</text>
  <text x="275" y="580" text-anchor="middle" class="t">Mai Elghabaty · Mariam El Karimy · Salma El Karimy</text>
  <text x="275" y="610" text-anchor="middle" class="small">Power electronics and wind-energy converter projects</text>

  <rect x="930" y="150" width="390" height="150" rx="26" class="node"/>
  <text x="1125" y="195" text-anchor="middle" class="h">University of Rochester</text>
  <text x="1125" y="230" text-anchor="middle" class="t">Joshua Li</text>
  <text x="1125" y="260" text-anchor="middle" class="small">Transformer-based forecasting and data-driven modeling</text>

  <rect x="930" y="500" width="390" height="150" rx="26" class="node"/>
  <text x="1125" y="545" text-anchor="middle" class="h">University of Connecticut</text>
  <text x="1125" y="580" text-anchor="middle" class="t">Kharissa Moore</text>
  <text x="1125" y="610" text-anchor="middle" class="small">Cyber-physical system co-simulation</text>

  <g transform="translate(482,655)">
    <rect width="436" height="54" rx="22" fill="#ffffff" opacity="0.12" stroke="#7fe4f2"/>
    <text x="218" y="35" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;fill:#e9fbff">Shared mission: trustworthy grid intelligence for critical energy systems</text>
  </g>
</svg>
